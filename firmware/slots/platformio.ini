; slots - ESP32 khu đỗ 4 ô (bãi xe thông minh)
; Build:  pio run
; Lên board: pio run -t upload
; Log:    pio device monitor
[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -Wall
    -Wextra
