<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" width="680" height="650" role="img">
<title>Mô hình board bãi xe thông minh nhìn từ trên xuống</title>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#3d3d3a}
.th{font-size:14px;font-weight:bold;fill:#2c2c2a}
.tt{font-size:14px;font-weight:bold;fill:#04342C}
.ts{font-size:12px;fill:#085041}
.board{fill:#F1EFE8;stroke:#B4B2A9;stroke-width:1}
