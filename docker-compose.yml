services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  alpr:
    build: ./alpr
    ports:
      - "8001:8001"
    environment:
      OCR_ENGINE: ${OCR_ENGINE:-rapidocr}
      PLATE_DETECTOR: ${PLATE_DETECTOR:-roi}
      ROI: ${ROI:-}
      YOLO_WEIGHTS: ${YOLO_WEIGHTS:-}
      MIN_PLATE_WIDTH: ${MIN_PLATE_WIDTH:-480}
    restart: unless-stopped

volumes:
  mosquitto_data:
  pg_data:
